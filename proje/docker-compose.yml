services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: team-task-manager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-task-manager-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=TeamTaskManagerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5073:8080"
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: team-task-manager-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  api-uploads:
