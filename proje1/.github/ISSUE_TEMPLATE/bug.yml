name: Hata
description: Tekrarlanabilir bir hata bildirimi
title: "[Bug]: "
labels: ["type: bug", "status: backlog"]
body:
  - type: textarea
    id: current
    attributes:
      label: Mevcut davranış
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log veya ekran görüntüsü
